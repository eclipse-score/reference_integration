  <!-- ===================== Panel 3: Coverage now ===================== -->
  <g>
    <text x="1170" y="50" text-anchor="middle" font-size="13" font-weight="bold">Code Coverage (now, weighted by # tests)</text>

    <line x1="1000" y1="70"  x2="1000" y2="280" stroke="#333"/>
    <line x1="1000" y1="280" x2="1340" y2="280" stroke="#333"/>

    <!-- y range 0..100% -->
    <g stroke="#ddd">
      <line x1="1000" y1="217" x2="1340" y2="217"/>
      <line x1="1000" y1="154" x2="1340" y2="154"/>
      <line x1="1000" y1="91"  x2="1340" y2="91"/>
    </g>
    <g fill="#555" text-anchor="end" font-size="11">
      <text x="995" y="283">0%</text>
      <text x="995" y="220">30%</text>
      <text x="995" y="157">60%</text>
      <text x="995" y="94">90%</text>
    </g>
    <!-- 100% reference line -->
    <line x1="1000" y1="70" x2="1340" y2="70" stroke="#bbb" stroke-dasharray="3,3"/>
    <text x="995" y="74" text-anchor="end" font-size="11" fill="#888">100%</text>

    <!-- scale: y = 280 - pct * 2.1 -->
    <!-- C0 (line) = 93.1 -->
    <rect x="1050" y="84.49" width="80" height="195.51" fill="#17becf"/>
    <text x="1090" y="78.49" text-anchor="middle" font-size="13" fill="#17becf" font-weight="bold">93.1%</text>
    <text x="1090" y="298" text-anchor="middle" font-weight="bold">C0 (line)</text>
    <!-- C1 (branch) = 60.6 -->
    <rect x="1190" y="152.74" width="80" height="127.26" fill="#17becf" fill-opacity="0.55"/>
    <text x="1230" y="146.74" text-anchor="middle" font-size="13" fill="#17becf" font-weight="bold">60.6%</text>
    <text x="1230" y="298" text-anchor="middle" font-weight="bold">C1 (branch)</text>
  </g>

  <!-- footer note -->
  <text x="700" y="350" text-anchor="middle" font-size="11" fill="#666">
    v0.5.0-beta–v0.7.0: static GTEST/Rust/Python test-macro counts • v0.8–v0.9: reference-CI test-run counts (incl. parameterized expansions; Security/Crypto and Some/IP are not in the reference CI) — methods diverge, see note • Coverage: C++ line/branch coverage weighted by unit-test count
  </text>
