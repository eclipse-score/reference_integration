<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="Arial, sans-serif" font-size="13">
  <title>PA3 Architecture Design — total Feature and Component Architecture items per release</title>

  <text x="440" y="22" text-anchor="middle" font-size="15" font-weight="bold">
    PA3 Architecture Design — total architecture items per release (sum of all modules)
  </text>

  <line x1="70" y1="50"  x2="70"  y2="260" stroke="#333" stroke-width="1"/>
  <line x1="70" y1="260" x2="850" y2="260" stroke="#333" stroke-width="1"/>

  <!-- y range 0..320 -->
  <g stroke="#ddd" stroke-width="1">
    <line x1="70" y1="207.5" x2="850" y2="207.5"/>
    <line x1="70" y1="155.0" x2="850" y2="155.0"/>
    <line x1="70" y1="102.5" x2="850" y2="102.5"/>
    <line x1="70" y1="50.0" x2="850" y2="50.0"/>
  </g>
  <g fill="#555" text-anchor="end" font-size="11">
    <text x="64" y="263">0</text>
    <text x="64" y="210.5">80</text>
    <text x="64" y="158.0">160</text>
    <text x="64" y="105.5">240</text>
    <text x="64" y="53.0">320</text>
  </g>

  <!-- scale: y = 260 - value * 0.65625 -->

  <!-- v0.5.0-beta: Feature Architecture=16 Component Architecture=83 -->
  <g>
    <rect x="88" y="249.5" width="50" height="10.5" fill="#1f77b4"/>
    <rect x="146" y="205.5" width="50" height="54.5" fill="#ff7f0e"/>
    <text x="113" y="243.5" text-anchor="middle" font-size="11" fill="#1f77b4" font-weight="bold">16</text>
    <text x="171" y="199.5" text-anchor="middle" font-size="11" fill="#ff7f0e" font-weight="bold">83</text>
    <text x="142" y="280" text-anchor="middle" font-weight="bold">v0.5.0-beta</text>
  </g>

  <!-- v0.6.0: Feature Architecture=19 Component Architecture=151 -->
  <g>
    <rect x="244" y="247.5" width="50" height="12.5" fill="#1f77b4"/>
    <rect x="302" y="160.9" width="50" height="99.1" fill="#ff7f0e"/>
    <text x="269" y="241.5" text-anchor="middle" font-size="11" fill="#1f77b4" font-weight="bold">19</text>
    <text x="327" y="154.9" text-anchor="middle" font-size="11" fill="#ff7f0e" font-weight="bold">151</text>
    <text x="298" y="280" text-anchor="middle" font-weight="bold">v0.6.0</text>
  </g>

  <!-- v0.7.0: Feature Architecture=21 Component Architecture=203 -->
  <g>
    <rect x="400" y="246.2" width="50" height="13.8" fill="#1f77b4"/>
    <rect x="458" y="126.8" width="50" height="133.2" fill="#ff7f0e"/>
    <text x="425" y="240.2" text-anchor="middle" font-size="11" fill="#1f77b4" font-weight="bold">21</text>
    <text x="483" y="120.8" text-anchor="middle" font-size="11" fill="#ff7f0e" font-weight="bold">203</text>
    <text x="454" y="280" text-anchor="middle" font-weight="bold">v0.7.0</text>
  </g>

  <!-- v0.8: Feature Architecture=23 Component Architecture=204 -->
  <g>
    <rect x="556" y="244.9" width="50" height="15.1" fill="#1f77b4"/>
    <rect x="614" y="126.1" width="50" height="133.9" fill="#ff7f0e"/>
    <text x="581" y="238.9" text-anchor="middle" font-size="11" fill="#1f77b4" font-weight="bold">23</text>
    <text x="639" y="120.1" text-anchor="middle" font-size="11" fill="#ff7f0e" font-weight="bold">204</text>
    <text x="610" y="280" text-anchor="middle" font-weight="bold">v0.8</text>
  </g>

  <!-- v0.9: Feature Architecture=29 Component Architecture=309 -->
  <g>
    <rect x="712" y="241.0" width="50" height="19.0" fill="#1f77b4"/>
    <rect x="770" y="57.2" width="50" height="202.8" fill="#ff7f0e"/>
    <text x="737" y="235.0" text-anchor="middle" font-size="11" fill="#1f77b4" font-weight="bold">29</text>
    <text x="795" y="51.2" text-anchor="middle" font-size="11" fill="#ff7f0e" font-weight="bold">309</text>
    <text x="766" y="280" text-anchor="middle" font-weight="bold">v0.9</text>
  </g>

  <!-- legend -->
  <g font-size="12">
    <rect x="240" y="298" width="14" height="12" fill="#1f77b4"/>
    <text x="260" y="308">Feature Architecture</text>
    <rect x="460" y="298" width="14" height="12" fill="#ff7f0e"/>
    <text x="480" y="308">Component Architecture</text>
  </g>
</svg>
