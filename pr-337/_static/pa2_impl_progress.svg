<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="Arial, sans-serif" font-size="13">
  <title>PA2 Implementation — total Feature and Component Requirements per release</title>

  <text x="440" y="22" text-anchor="middle" font-size="15" font-weight="bold">
    PA2 Implementation — total requirements per release (sum of all modules)
  </text>

  <line x1="70" y1="50"  x2="70"  y2="260" stroke="#333" stroke-width="1"/>
  <line x1="70" y1="260" x2="850" y2="260" stroke="#333" stroke-width="1"/>

  <!-- y range 0..800 -->
  <g stroke="#ddd" stroke-width="1">
    <line x1="70" y1="233.75" x2="850" y2="233.75"/>
    <line x1="70" y1="207.5" x2="850" y2="207.5"/>
    <line x1="70" y1="181.25" x2="850" y2="181.25"/>
    <line x1="70" y1="155.0" x2="850" y2="155.0"/>
    <line x1="70" y1="128.75" x2="850" y2="128.75"/>
    <line x1="70" y1="102.5" x2="850" y2="102.5"/>
    <line x1="70" y1="76.25" x2="850" y2="76.25"/>
    <line x1="70" y1="50.0" x2="850" y2="50.0"/>
  </g>
  <g fill="#555" text-anchor="end" font-size="11">
    <text x="64" y="263">0</text>
    <text x="64" y="236.75">100</text>
    <text x="64" y="210.5">200</text>
    <text x="64" y="184.25">300</text>
    <text x="64" y="158.0">400</text>
    <text x="64" y="131.75">500</text>
    <text x="64" y="105.5">600</text>
    <text x="64" y="79.25">700</text>
    <text x="64" y="53.0">800</text>
  </g>

  <!-- scale: y = 260 - value * 0.2625 -->

  <!-- v0.5.0-beta: Feature Requirements=313 Component Requirements=80 -->
  <g>
    <rect x="88" y="177.8" width="50" height="82.2" fill="#1f77b4"/>
    <rect x="146" y="239.0" width="50" height="21.0" fill="#ff7f0e"/>
    <text x="113" y="171.8" text-anchor="middle" font-size="11" fill="#1f77b4" font-weight="bold">313</text>
    <text x="171" y="233.0" text-anchor="middle" font-size="11" fill="#ff7f0e" font-weight="bold">80</text>
    <text x="142" y="280" text-anchor="middle" font-weight="bold">v0.5.0-beta</text>
  </g>

  <!-- v0.6.0: Feature Requirements=315 Component Requirements=160 -->
  <g>
    <rect x="244" y="177.3" width="50" height="82.7" fill="#1f77b4"/>
    <rect x="302" y="218.0" width="50" height="42.0" fill="#ff7f0e"/>
    <text x="269" y="171.3" text-anchor="middle" font-size="11" fill="#1f77b4" font-weight="bold">315</text>
    <text x="327" y="212.0" text-anchor="middle" font-size="11" fill="#ff7f0e" font-weight="bold">160</text>
    <text x="298" y="280" text-anchor="middle" font-weight="bold">v0.6.0</text>
  </g>

  <!-- v0.7.0: Feature Requirements=316 Component Requirements=186 -->
  <g>
    <rect x="400" y="177.0" width="50" height="83.0" fill="#1f77b4"/>
    <rect x="458" y="211.2" width="50" height="48.8" fill="#ff7f0e"/>
    <text x="425" y="171.0" text-anchor="middle" font-size="11" fill="#1f77b4" font-weight="bold">316</text>
    <text x="483" y="205.2" text-anchor="middle" font-size="11" fill="#ff7f0e" font-weight="bold">186</text>
    <text x="454" y="280" text-anchor="middle" font-weight="bold">v0.7.0</text>
  </g>

  <!-- v0.8: Feature Requirements=341 Component Requirements=607 -->
  <g>
    <rect x="556" y="170.5" width="50" height="89.5" fill="#1f77b4"/>
    <rect x="614" y="100.7" width="50" height="159.3" fill="#ff7f0e"/>
    <text x="581" y="164.5" text-anchor="middle" font-size="11" fill="#1f77b4" font-weight="bold">341</text>
    <text x="639" y="94.7" text-anchor="middle" font-size="11" fill="#ff7f0e" font-weight="bold">607</text>
    <text x="610" y="280" text-anchor="middle" font-weight="bold">v0.8</text>
  </g>

  <!-- v0.9: Feature Requirements=297 Component Requirements=783 -->
  <g>
    <rect x="712" y="182.0" width="50" height="78.0" fill="#1f77b4"/>
    <rect x="770" y="54.5" width="50" height="205.5" fill="#ff7f0e"/>
    <text x="737" y="176.0" text-anchor="middle" font-size="11" fill="#1f77b4" font-weight="bold">297</text>
    <text x="795" y="48.5" text-anchor="middle" font-size="11" fill="#ff7f0e" font-weight="bold">783</text>
    <text x="766" y="280" text-anchor="middle" font-weight="bold">v0.9</text>
  </g>

  <!-- legend -->
  <g font-size="12">
    <rect x="240" y="298" width="14" height="12" fill="#1f77b4"/>
    <text x="260" y="308">Feature Requirements</text>
    <rect x="460" y="298" width="14" height="12" fill="#ff7f0e"/>
    <text x="480" y="308">Component Requirements</text>
  </g>
</svg>
