# The configuration of the CDA in the Diagnostics Stack showcase. The settings of the ECUs are
# appended to it (see BUILD).
flash_files_path = "/var/lib/opensovd-cda/flash"

[database]
dir = "/showcases/data/diagnostics/databases"
exit_no_database_loaded = false

[runtime_update_config]
storage_dir = "/var/lib/opensovd-cda/storage"

# The CDA finds the ECUs by DoIP broadcast to 255.255.255.255. With the tester address 0.0.0.0 the
# host picks the interface and the source address from its routes, so this configuration needs no
# address of the host. It does need a route for the broadcast, for example a default route: without
# one the CDA stops at startup with "Failed to send VIR: ... Network is unreachable". The subnet mask
# 0.0.0.0 accepts vehicle announcements from any address.
[doip]
tester_address = "0.0.0.0"
tester_subnet = "0.0.0.0"

# The CDA listens on a Unix domain socket only, not on a TCP port: its clients use the gateway,
# which forwards to it there (SOVD_UPSTREAM_URL in launch_manager_config.json). /run exists on the
# targets.
[server]
transport = "unix_socket"
unix_socket = "/run/opensovd-cda.sock"
