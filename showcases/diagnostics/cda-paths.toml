# Paths and address of the CDA in the Diagnostics Stack showcase. The settings of the ECUs are
# appended.
flash_files_path = "/tmp/opensovd-cda/flash"

[database]
dir = "/showcases/data/diagnostics/databases"
exit_no_database_loaded = true

[runtime_update_config]
storage_dir = "/tmp/opensovd-cda/storage"

# The CDA finds the ECUs by DoIP broadcast. With the tester address and the subnet mask 0.0.0.0 it
# sends the request to 255.255.255.255 from the address that the host picks for it: no address of
# this host has to be known.
[doip]
tester_address = "0.0.0.0"
tester_subnet = "0.0.0.0"

[server]
address = "127.0.0.1"
port = 20002

