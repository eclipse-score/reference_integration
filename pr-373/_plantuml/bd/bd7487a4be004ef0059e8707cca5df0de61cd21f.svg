th d="M2049.123,283.3628 L2049.123,293.3628 L2059.123,293.3628 L2049.123,283.3628 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.1338" x="1852.5" y="300.4297">Not an assumed production</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.623" x="1852.5" y="315.5625">commitment; decision-gated.</text></g><g id="elem_N1"><path d="M991.5,222.8628 L991.5,384.1909 L1268.2344,384.1909 L1268.2344,232.8628 L1258.2344,222.8628 L991.5,222.8628 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1258.2344,222.8628 L1258.2344,232.8628 L1268.2344,232.8628 L1258.2344,222.8628 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.2617" x="997.5" y="239.9297">Each repo owns its own phase gates,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.4697" x="997.5" y="255.0625">safety plan, and governance; the only</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.5439" x="997.5" y="270.1953">cross-repo contract is the Recorder</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.7705" x="997.5" y="285.3281">interface + static backend_table</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.2563" x="997.5" y="300.4609">registration (plugin_api.h is an</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.7461" x="997.5" y="315.5938">existing C ABI seam, not used</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.8784" x="997.5" y="330.7266">for static composition). The Rust</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.7344" x="997.5" y="345.8594">bridge reaches the Frontend/Recorders</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.2368" x="997.5" y="360.9922">the same way, via direct static</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.0776" x="997.5" y="376.125">linkage rather than backend_table.</text></g><!--link Frontend to Console--><g id="link_Frontend_Console"><path d="M1686,155.2628 C1686,176.6028 1686,202.8628 1686,202.8628 C1686,202.8628 1416,202.8628 1416,202.8628 C1416,202.8628 1416,240.9228 1416,270.6928 " fill="transparent" id="Frontend-to-Console" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1416,276.6928,1420,267.6928,1416,271.6928,1412,267.6928,1416,276.6928" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.8081" x="1349.89" y="198.9297">static composition (baseline)</text></g><!--link Frontend to FrontendPlan--><g id="link_Frontend_FrontendPlan"><path d="M1742.5,154.9428 C1742.5,187.3528 1742.5,241.9128 1742.5,275.0828 " fill="transparent" id="Frontend-FrontendPlan" style="stroke:#181818;stroke-width:1;stroke-dasharray:7.0,7.0;"/></g><!--link Recorders to Integration--><g id="link_Recorders_Integration"><path d="M414.34,128.8628 C308.76,128.8628 165,128.8628 165,128.8628 C165,128.8628 165,222.0428 165,270.8628 " fill="transparent" id="Recorders-to-Integration" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="165,276.8628,169,267.8628,165,271.8628,161,267.8628,165,276.8628" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.1147" x="99.67" y="124.9297">static registration</text></g><!--link Recorders to BackendPlan--><g id="link_Rec