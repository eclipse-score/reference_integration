# Uploads test.xml, test.log and coverage.dat from bazel-testlogs/ as one artifact. The layout
# stays relative to bazel-testlogs/ (e.g. external/<repo>+/.../test.xml) because the
# documentation's source code linker and the release test-report ZIP depend on those paths.
# Symlinks are dereferenced. Call it with `if: always()` so failing runs still deliver reports.
name: Collect test reports
description: Upload the Bazel test reports of this job as a uniquely named artifact.
inputs:
  name:
    description: Artifact name, test-reports-<suite>-<platform>[-<distro>].
    required: true
runs:
  using: composite
  steps:
    - name: Copy test reports
      shell: bash
      env:
        OUT: ${{ runner.temp }}/test-reports
      run: |
        set -euo pipefail
        mkdir -p "${OUT}"
        if [ ! -e bazel-testlogs ]; then
          echo "::warning::No bazel-testlogs in this workspace; uploading nothing."
          exit 0
        fi
        # find + cp instead of rsync, which self-hosted runners may not have.
        cd bazel-testlogs/
        find -L . -type f \( -name test.xml -o -name test.log -o -name coverage.dat \) \
          -exec cp -L --parents -t "${OUT}/" {} +
    - name: Upload test reports
      uses: actions/upload-artifact@604373da6381bf24206979c74d06a550515601b9 # v4.4.1
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/test-reports/
        if-no-files-found: warn
