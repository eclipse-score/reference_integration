name: Linux - Build & Integration Test
on:
  workflow_dispatch:
  pull_request:
  release:
    types: [created]
  push:
    branches:
      - main
  # Called by unified_workflow.yml. The event triggers above stay until the unified pipeline is
  # the required check (rollout stage D); inputs are empty for those standalone runs, and a
  # non-empty resolved_inputs is what marks a called run.
  workflow_call:
    inputs:
      fresh:
        description: Build and test from scratch (no disk cache, no cached test results).
        type: boolean
        required: false
        default: false
      resolved_inputs:
        description: >-
          Name of the resolved-inputs artifact to restore. Set by unified_workflow.yml, which also marks the run as called; empty for standalone runs (committed files).
        type: string
        required: false
        default: ''
# Do not flood CI with unneeded previous runs in PR. Literal prefix and a per-run group when
# called: inside a call github.workflow is the caller's name, and the leaves of one unified run
# must not share a group with each other or with the caller.
concurrency:
  group: build-and-test-linux-${{ inputs.resolved_inputs != '' && github.run_id || github.event.pull_request.number }}
  cancel-in-progress: ${{ inputs.resolved_inputs == '' && github.ref_name != 'main' && !startsWith(github.ref_name, 'release/') }}
jobs:
  x86_64:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # full_clean: passed on the command line instead of touching ~/.bazelrc.
      NOCACHE: ${{ inputs.fresh && '--nocache_test_results' || '' }}
    steps:
      - name: Clean disk space
        uses: eclipse-score/more-disk-space@v1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore resolved inputs
        if: inputs.resolved_inputs != ''
        uses: ./.github/actions/restore-resolved-inputs
        with:
          artifact: ${{ inputs.resolved_inputs }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          # Literal cache name: inside a called workflow github.workflow is the caller's name.
          disk-cache: ${{ inputs.fresh && 'false' || 'Linux - Build & Integration Test' }}
          repository-cache: true
          cache-save: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      - name: Install uv (required for SBOM license scanning)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Build image and product SBOM
        run: |
          bazel build --lockfile_mode=error --config=linux-x86_64 --keep_going \
            //images/linux_x86_64:image \
            //:sbom
      - name: Unit tests
        run: |
          bazel test --lockfile_mode=error --config=linux-x86_64 ${NOCACHE} //deploy/platform_info:platform_info_test
      - name: Integration tests
        if: ${{ !cancelled() }}
        run: |
          bazel test --lockfile_mode=error --config=linux-x86_64 ${NOCACHE} //feature_integration_tests/itf
      - name: Upload test reports
        if: always()
        uses: ./.github/actions/collect-test-reports
        with:
          name: test-reports-itf-linux-x86_64
      - name: Upload product SBOM
        uses: actions/upload-artifact@604373da6381bf24206979c74d06a550515601b9 # v4.4.1
        with:
          name: sbom-spdx
          path: bazel-bin/sbom.spdx.json
