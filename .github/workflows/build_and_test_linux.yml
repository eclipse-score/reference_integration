name: Linux - Build & Integration Test
on:
  workflow_dispatch:
  pull_request:
  release:
    types: [created]
  push:
    branches:
      - main
# Do not flood CI with unneeded previous runs in PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.ref_name != 'main' && !startsWith(github.ref_name, 'release/') }}
jobs:
  x86_64:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # required to upload release assets
    steps:
      - name: Clean disk space
        uses: eclipse-score/more-disk-space@v1
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0
      - name: Setup Bazel
        uses: eclipse-score/cicd-actions/setup-bazel-cache@28233566af2525acf84b3c66cfa66ae2583e4236
        with:
          disk-cache-key: ${{ github.workflow }}
          cache-save-branch-patterns: |
            main
            release/**
            releases/**
          # PR target runs use the base branch ref; only branch runs may save.
          bazelisk-cache-save: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          disk-cache-save: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          repository-cache-save: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'auto' || 'false' }}
          external-cache-save: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          # Keep downloaded archives reusable when dependency lockfiles change.
          repository-cache-restore: true
      - name: Install uv (required for SBOM license scanning)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Build image and product SBOM
        run: |
          bazel build --lockfile_mode=error --config=linux-x86_64 --keep_going \
            //images/linux_x86_64:image \
            //:sbom
      - name: Unit tests
        run: |
          bazel test --lockfile_mode=error --config=linux-x86_64 //deploy/platform_info:platform_info_test
      - name: Integration tests
        run: |
          bazel test --lockfile_mode=error --config=linux-x86_64 //feature_integration_tests/itf
      - name: Upload product SBOM
        uses: actions/upload-artifact@604373da6381bf24206979c74d06a550515601b9 # v4.4.1
        with:
          name: sbom-spdx
          path: bazel-bin/sbom.spdx.json
