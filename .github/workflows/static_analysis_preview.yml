# POC, delete before merge: runs every C++ target_sw module's CodeQL target and every module's lint
# config (both from patches/<module>/*-static-analysis-contract.patch until the modules carry them) -
# each module as root workspace with ref_int's resolved versions, like module_tests.yml - and builds
# the docs with these findings in the module verification reports, all in this run.
name: Static Analysis Report Preview (temporary)
permissions:
  contents: read
  actions: read
on:
  push:
    branches:
      - poc/static-analysis-codeql
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  modules:
    name: List C++ modules
    runs-on: ubuntu-24.04
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
      all_modules: ${{ steps.modules.outputs.all_modules }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: List modules
        id: modules
        env:
          # Temporary: only rerun the module under investigation (empty = all).
          ONLY_MODULES: ""
        run: |
          echo "modules=$(jq -c --arg only "${ONLY_MODULES}" '.modules.target_sw | to_entries
            | map(select((.value.metadata.langs // ["cpp", "rust"]) | index("cpp"))) | map(.key)
            | map(. as $m | select($only == "" or ($only | split(",") | any(. == $m)))) ' known_good.json)" >> "$GITHUB_OUTPUT"
          echo "all_modules=$(jq -c --arg only "${ONLY_MODULES}" '.modules.target_sw | keys
            | map(. as $m | select($only == "" or ($only | split(",") | any(. == $m)))) ' known_good.json)" >> "$GITHUB_OUTPUT"
  codeql:
    name: CodeQL ${{ matrix.module }}
    needs: modules
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    steps:
      - name: Clean disk space
        uses: eclipse-score/more-disk-space@v1.1
        with:
          level: 4
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          # Reuse (read only) the disk cache of the module tests on main.
          disk-cache: Code Quality & Documentation-${{ matrix.module }}
          repository-cache: true
          cache-save: false
      - name: CodeQL (//quality/static_analysis:codeql of the module)
        run: python3 scripts/module_tests.py codeql ${{ matrix.module }}
      - name: Upload CodeQL results
        if: always()
        uses: actions/upload-artifact@604373da6381bf24206979c74d06a550515601b9 # v4.4.1
        with:
          name: codeql-${{ matrix.module }}
          # The reports/ root keeps the <module>/ folder, so a merged download has one per module.
          path: _module_codeql/reports/
          retention-days: 7
          if-no-files-found: warn
  lint:
    name: Lint ${{ matrix.module }}
    needs: modules
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.all_modules) }}
    steps:
      - name: Clean disk space
        uses: eclipse-score/more-disk-space@v1.1
        with:
          level: 4
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          # Reuse (read only) the disk cache of the module tests on main.
          disk-cache: Code Quality & Documentation-${{ matrix.module }}
          repository-cache: true
          cache-save: false
      - name: Lint (--config=lint of the module)
        run: python3 scripts/module_tests.py lint ${{ matrix.module }}
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@604373da6381bf24206979c74d06a550515601b9 # v4.4.1
        with:
          name: lint-${{ matrix.module }}
          path: _module_lint/reports/
          retention-days: 7
          if-no-files-found: warn
  docs:
    needs: [codeql, lint]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Clean disk space
        uses: eclipse-score/more-disk-space@v1.1
        with:
          level: 4
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          # Reuse (read only) the disk cache of "Code Quality & Documentation" on main.
          disk-cache: Code Quality & Documentation
          repository-cache: |
            - MODULE.bazel
            - known_good.json
            - bazel_common/*.MODULE.bazel
            - patches/**
            - .bazelrc
          cache-save: false
      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Graphviz
        uses: eclipse-score/apt-install@main
        with:
          packages: graphviz
          cache: false
      - name: Download CodeQL results
        uses: actions/download-artifact@v4.1.8
        with:
          pattern: codeql-*
          path: _module_codeql
          merge-multiple: true
      - name: Download lint results
        uses: actions/download-artifact@v4.1.8
        with:
          pattern: lint-*
          path: _module_lint
          merge-multiple: true
      - name: Hand the module SARIF files to the docs build
        run: |
          mkdir -p static-analysis-report
          find _module_codeql _module_lint -path '*/static_analysis/*.sarif' -exec cp {} static-analysis-report/ \;
          ls -la static-analysis-report
      - name: Build documentation
        run: |
          bazel run \
            --lockfile_mode=error \
              //:docs_shim -- \
              --github_user=${{ github.repository_owner }} \
              --github_repo=${{ github.event.repository.name }}
          tar -cf docs-preview.tar _build
      - name: Upload documentation
        uses: actions/upload-artifact@604373da6381bf24206979c74d06a550515601b9 # v4.4.1
        with:
          name: static-analysis-preview-docs
          path: docs-preview.tar
          retention-days: 7
