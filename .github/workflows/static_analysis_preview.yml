# POC, delete before merge: scans all modules with CodeQL in this run and builds the
# docs with these findings in the module verification reports.
name: Static Analysis Report Preview (temporary)
permissions:
  contents: read
  actions: read
on:
  push:
    branches:
      - poc/static-analysis-codeql
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codeql:
    uses: ./.github/workflows/codeql-multiple-repo-scan.yml
    permissions:
      contents: write
      security-events: write
      packages: read
      actions: read
  docs:
    needs: codeql
    runs-on: ubuntu-24.04
    steps:
      - name: Clean disk space
        uses: eclipse-score/more-disk-space@v1.1
        with:
          level: 4
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          # Reuse (read only) the disk cache of "Code Quality & Documentation" on main.
          disk-cache: Code Quality & Documentation
          repository-cache: |
            - MODULE.bazel
            - known_good.json
            - bazel_common/*.MODULE.bazel
            - patches/**
            - .bazelrc
          cache-save: false
      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Graphviz
        uses: eclipse-score/apt-install@main
        with:
          packages: graphviz
          cache: false
      - name: Download CodeQL SARIF of this run
        uses: actions/download-artifact@v4
        with:
          name: codeql-sarif-results
          path: codeql-sarif
      - name: Prepare SARIF for the docs build
        run: |
          python3 scripts/static_analysis/prepare_codeql_sarif.py \
            codeql-sarif/cpp.sarif static-analysis-report/codeql.sarif
      - name: Build documentation
        run: |
          bazel run \
            --lockfile_mode=error \
              //:docs_shim -- \
              --github_user=${{ github.repository_owner }} \
              --github_repo=${{ github.event.repository.name }}
          tar -cf docs-preview.tar _build
      - name: Upload documentation
        uses: actions/upload-artifact@604373da6381bf24206979c74d06a550515601b9 # v4.4.1
        with:
          name: static-analysis-preview-docs
          path: docs-preview.tar
          retention-days: 7
