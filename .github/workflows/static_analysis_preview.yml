# POC, delete before merge: analyses the integrated modules with the Bazel based CodeQL
# tooling of score_tools (tools#69) and builds the docs with these findings in the
# module verification reports, all in this run.
name: Static Analysis Report Preview (temporary)
permissions:
  contents: read
  actions: read
on:
  push:
    branches:
      - poc/static-analysis-codeql
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Clean disk space
        uses: eclipse-score/more-disk-space@v1.1
        with:
          level: 4
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          # Reuse (read only) the disk cache of "Code Quality & Documentation" on main.
          disk-cache: Code Quality & Documentation
          repository-cache: |
            - MODULE.bazel
            - known_good.json
            - bazel_common/*.MODULE.bazel
            - patches/**
            - .bazelrc
          cache-save: false
      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Graphviz
        uses: eclipse-score/apt-install@main
        with:
          packages: graphviz
          cache: false
      - name: CodeQL analysis (score_tools codeql_sca, ASIL preset)
        env:
          SCORE_CODEQL_INCLUDE_GLOBS: "**/external/score_*/**"
        run: |
          bazel run --lockfile_mode=error //scripts/static_analysis:sca_linux -- \
            --output-dir="${GITHUB_WORKSPACE}/_codeql_sca" \
            --no-fail-sarif-quality --no-fail-suppressions
          cat _codeql_sca/results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Hand the per-report SARIF files to the docs build
        # code-scanning.sarif drops all results outside this repository, i.e. all module findings.
        run: |
          mkdir -p static-analysis-report
          find _codeql_sca/results -maxdepth 1 -name '*.sarif' ! -name code-scanning.sarif \
            -exec cp {} static-analysis-report/ \;
          ls -la static-analysis-report
      - name: Upload CodeQL results
        if: always()
        uses: actions/upload-artifact@604373da6381bf24206979c74d06a550515601b9 # v4.4.1
        with:
          name: codeql-sca-results
          path: _codeql_sca/results
          retention-days: 7
      - name: Build documentation
        run: |
          bazel run \
            --lockfile_mode=error \
              //:docs_shim -- \
              --github_user=${{ github.repository_owner }} \
              --github_repo=${{ github.event.repository.name }}
          tar -cf docs-preview.tar _build
      - name: Upload documentation
        uses: actions/upload-artifact@604373da6381bf24206979c74d06a550515601b9 # v4.4.1
        with:
          name: static-analysis-preview-docs
          path: docs-preview.tar
          retention-days: 7
