# THROWAWAY preview workflow - DELETE before merging this PR.
#
# The real wiring lives in test_and_docs.yml, but that job runs via
# `pull_request_target`, which reads its YAML from the base branch (main) - so
# the new "Execute Baselibs Integration Tests" step added on this branch never
# runs in the PR. A `push` event instead reads the YAML from the pushed commit,
# so this workflow actually exercises the new step and proves the baselibs
# feature requirement coverage shows up in the platform verification report.
name: Preview - Baselibs Coverage (throwaway)
on:
  push:
    branches:
      - feat/baselibs-integration-tests
concurrency:
  # push events have no pull_request.number, so key on the ref.
  group: preview-baselibs-coverage-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  preview:
    runs-on: ${{ vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-latest' }}
    steps:
      - name: Clean disk space
        uses: eclipse-score/more-disk-space@v1.1
        with:
          level: 4
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Docker Buildx
        # Required by the baselibs integration tests, which deploy the test app
        # via a Docker target built from //images/linux_x86_64:image.
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: |
            - MODULE.bazel
            - known_good.json
            - bazel_common/*.MODULE.bazel
            - patches/**
            - .bazelrc
          cache-save: false
      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Graphviz
        uses: eclipse-score/apt-install@main
        with:
          packages: graphviz
          cache: false
      - name: Execute Baselibs Integration Tests
        # Must run before the documentation build and in this same workspace:
        # the docs source code linker scans `bazel-testlogs` for the JUnit XML
        # that carries the PartiallyVerifies properties.
        run: |
          bazel test --lockfile_mode=error --config=linux-x86_64 \
            //feature_integration_tests/baselibs_integration_tests:bit
      - name: Show recorded PartiallyVerifies properties
        if: always()
        run: |
          echo "## baselibs test.xml PartiallyVerifies:"
          find bazel-testlogs -path '*baselibs_integration_tests*' -name 'test.xml' \
            -exec sh -c 'echo "--- $1 ---"; grep -o "feat_req__baselibs__[a-z_]*" "$1" | sort -u' _ {} \;
      - name: Execute Lifecycle Integration Tests
        # Exposed to this non-root consumer via
        # //patches/lifecycle:002-undev-integration-test-deps.patch. Runs before
        # the documentation build so the docs source code linker picks up their
        # PartiallyVerifies properties from bazel-testlogs.
        run: |
          bazel test --lockfile_mode=error --config=linux-x86_64 \
            --@score_lifecycle//config:integration_mode=docker \
            @score_lifecycle//tests/integration/crash_on_startup:crash_on_startup \
            @score_lifecycle//tests/integration/parallel_launch:parallel_launch \
            @score_lifecycle//tests/integration/process_complex_rep_failure:process_complex_rep_failure \
            @score_lifecycle//tests/integration/process_crash_monitoring:process_crash_monitoring \
            @score_lifecycle//tests/integration/process_fd_leak:process_fd_leak \
            @score_lifecycle//tests/integration/process_launch_args:process_launch_args \
            @score_lifecycle//tests/integration/process_simple_rep_failure:process_simple_rep_failure \
            @score_lifecycle//tests/integration/rt_running_when_process_exits:rt_running_when_process_exits \
            @score_lifecycle//tests/integration/switch_run_target:switch_run_target
      - name: Show recorded lifecycle PartiallyVerifies properties
        if: always()
        run: |
          echo "## lifecycle test.xml PartiallyVerifies:"
          find bazel-testlogs -path '*score_lifecycle*tests/integration*' -name 'test.xml' \
            -exec sh -c 'echo "--- $1 ---"; grep -o "feat_req__lifecycle__[a-z_]*" "$1" | sort -u' _ {} \;
      - name: Build documentation
        run: |
          bazel run \
            --lockfile_mode=error \
              //:docs_shim -- \
              --github_user=${{ github.repository_owner }} \
              --github_repo=${{ github.event.repository.name }}
      - name: Verify baselibs feature requirements are linked by tests
        run: |
          set -e
          echo "## Searching rendered docs for baselibs test links..."
          missing=0
          for t in \
            test_json_library_parses_document \
            test_utils_library_base64_roundtrip \
            test_bitmanipulation_library_sets_and_toggles_bits \
            test_hash_library_crc32_ieee_check_value \
            test_containers_library_dynamic_array \
            test_result_library_error_handling \
            test_concurrency_library_notification \
            test_filesystem_library_path_decomposition \
            test_memory_library_pmr_ring_buffer \
            test_static_reflection_library_serialize_roundtrip \
            test_flatbuffers_library_build_and_lookup; do
            if grep -rq "$t" _build; then
              echo "OK   $t is referenced in the rendered docs"
            else
              echo "MISS $t is NOT referenced in the rendered docs"
              missing=1
            fi
          done
          echo "## feat_req__baselibs__* occurrences carrying a testlink in needs.json:"
          grep -o "feat_req__baselibs__[a-z_]*" _build/needs.json 2>/dev/null | sort -u || true
          if [ "$missing" -ne 0 ]; then
            echo "::error::At least one baselibs feature test is not linked in the report"
            exit 1
          fi
      - name: Verify lifecycle feature requirements are linked by tests
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("_build/needs.json"))
          needs = {}
          for v in d.get("versions", {}).values():
              needs.update(v.get("needs", {}))
          expected = [
              "feat_req__lifecycle__launch_support",
              "feat_req__lifecycle__start_named_run_target",
              "feat_req__lifecycle__parallel_launch_support",
              "feat_req__lifecycle__monitor_abnormal_term",
              "feat_req__lifecycle__recov_run_target_switch",
              "feat_req__lifecycle__recovery_action_support",
              "feat_req__lifecycle__process_ordering",
              "feat_req__lifecycle__process_termination",
              "feat_req__lifecycle__request_run_target_start",
              "feat_req__lifecycle__switch_run_targets",
              "feat_req__lifecycle__terminationn_dependency",
          ]
          missing = []
          for r in expected:
              n = needs.get(r)
              if n and n.get("testlink"):
                  print(f"OK   {r} has a testlink")
              else:
                  print(f"MISS {r} has NO testlink")
                  missing.append(r)
          if missing:
              print(f"::error::lifecycle feature requirements without testlink: {missing}")
              sys.exit(1)
          PY
      - name: Upload rendered documentation (report preview)
        if: always()
        run: tar -cf baselibs-report-preview.tar _build
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@604373da6381bf24206979c74d06a550515601b9 # v4.4.1
        with:
          name: baselibs-report-preview-${{ github.sha }}
          path: baselibs-report-preview.tar
          retention-days: 3
          if-no-files-found: error
