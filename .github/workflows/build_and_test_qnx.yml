name: QNX8 - Build & Integration Test
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
      - 'release/**'
      - 'releases/**'
# Do not flood CI with unneeded previous runs in PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' && !startsWith(github.ref_name, 'release/') && !startsWith(github.ref_name, 'releases/') }}
jobs:
  qnx-build-x86_64:
    name: x86_64
    runs-on: ${{ vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-24.04' }}
    environment: ${{ inputs.environment-name }}
    permissions:
      actions: write # Remove obsolete cache generations after a successful upload.
      contents: read
      pull-requests: read
    steps:
      - name: Clean disk space
        uses: eclipse-score/more-disk-space@v1
      - name: Checkout repository (Handle all events)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          allow-unsafe-pr-checkout: true
      - name: Setup Bazel with shared caching
        uses: eclipse-score/cicd-actions/setup-bazel-cache@28233566af2525acf84b3c66cfa66ae2583e4236
        with:
          disk-cache-key: ${{ github.workflow }}-${{ github.job }}
          cache-save-branch-patterns: |
            main
            release/**
            releases/**
          # pull_request_target uses the base branch ref even when testing PR code.
          # Only trusted branch runs may publish cache generations.
          bazelisk-cache-save: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          disk-cache-save: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          repository-cache-save: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'auto' || 'false' }}
          external-cache-save: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          # Preserve even small additions, such as a newly downloaded toolchain.
          repository-cache-growth-threshold: 0
      - name: Prepare QNX license
        env:
          SCORE_QNX_LICENSE: ${{ secrets.SCORE_QNX_LICENSE }}
        run: |
          set -euo pipefail

          LICENSE_DIR="/opt/score_qnx/license"
          sudo mkdir -p "${LICENSE_DIR}"
          echo "${SCORE_QNX_LICENSE}" | base64 --decode | sudo tee "${LICENSE_DIR}/licenses" >/dev/null
      - name: Install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build with QNX toolchain
        env:
          SCORE_QNX_USER: ${{ secrets.SCORE_QNX_USER }}
          SCORE_QNX_PASSWORD: ${{ secrets.SCORE_QNX_PASSWORD }}
        run: |
          bazel build --lockfile_mode=error --config qnx-x86_64 //images/qnx_x86_64:image
      - name: Run integration tests
        run: |
          bazel test --lockfile_mode=error --config=itf-qnx-x86_64 //feature_integration_tests/itf
      - name: Cleanup QNX license
        if: always()
        run: sudo rm -rf /opt/score_qnx
