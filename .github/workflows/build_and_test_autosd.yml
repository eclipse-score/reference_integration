name: AutoSD - Build & Integration Test
on:
  release:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
# Do not flood CI with unneeded previous runs in PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.ref_name != 'main' && !startsWith(github.ref_name, 'release/') }}
jobs:
  build:
    strategy:
      matrix:
        target:
          - x86_64
          - aarch64
        include:
          - target: x86_64
            oci_target: amd64
            runner: ubuntu-24.04
            bazel_config: autosd-x86_64
          - target: aarch64
            oci_target: arm64
            runner: ubuntu-24.04
            bazel_config: autosd-crossland
    name: autosd-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    env:
      AIB_SCRIPT_URL: https://gitlab.com/CentOS/automotive/src/automotive-image-builder/-/raw/1.3.0/auto-image-builder.sh?ref_type=tags
      AIB_CONTAINER_IMAGE: quay.io/centos-sig-automotive/automotive-image-builder:1.3.0
    steps:
      - name: Clean disk space
        uses: eclipse-score/more-disk-space@v1
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      - name: Shows kernel version
        run: |
          uname -a
      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y podman curl qemu-system createrepo-c tree skopeo
      - name: Build and Export Showcases OCI Image
        run: |
          bazel build --announce_rc --lockfile_mode=error --config ${{ matrix.bazel_config }} //images/autosd:bootc_qemu

          tree bazel-bin
      - name: Export OCI Archive
        run: |
          skopeo copy \
          oci:bazel-bin/images/autosd/bootc_qemu_${{matrix.oci_target}} \
          oci-archive:autosd-bootc-qemu-${{matrix.oci_target}}.oci

          stat autosd-bootc-qemu-${{matrix.oci_target}}.oci
      - name: Download AutoSD Image
        run: |
          wget \
          -L --tries=10 --retry-connrefused --waitretry=5 \
          -O disk.qcow2.xz \
          https://github.com/eclipse-autosd/eclipse-autosd/releases/download/dev/eclipse-autosd-bootc-qemu-${{ matrix.target }}.qcow2.xz

          xz -d disk.qcow2.xz
        working-directory: ./images/autosd
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test QEMU image
        run: |
          sshcmd() {
            sshpass -p "$SSH_PASSWORD" \
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -p 2222 root@localhost \
            $@
          }

          scpcmd() {
            sshpass -p "$SSH_PASSWORD" scp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -P 2222 \
            $@
          }

          wait_for_ssh() {
            for i in $(seq 1 100); do
              if sshpass -p "$SSH_PASSWORD" \
                ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=3 \
                -p 2222 root@localhost true 2>/dev/null; then
                return 0
              fi
              sleep 3
            done
            echo "Timed out waiting for SSH" >&2
            return 1
          }

          QEMU_ARCH=${{ matrix.target }} ./scripts/run_qemu
          wait_for_ssh
          sshcmd 'cat /etc/os-release'
          scpcmd '../../autosd-bootc-qemu-${{matrix.oci_target}}.oci root@localhost:/tmp/autosd-bootc-qemu-${{matrix.oci_target}}.oci'
          sshcmd 'bootc switch --apply --transport oci-archive /tmp/autosd-bootc-qemu-${{matrix.oci_target}}.oci' || true
          wait_for_ssh
          sshcmd 'bootc status'
          # Workaround: config_daemon runs forever, so run all showcases except it
          # (CLI reads *.score.json from SCORE_CLI_INIT_DIR). Drop once the daemon exits on its own.
          sshcmd 'cp -a /showcases /tmp/showcases && grep -rl --include="*.score.json" config_daemon /tmp/showcases | xargs rm -f'
          sshcmd 'SCORE_CLI_INIT_DIR=/tmp/showcases timeout 900 /tmp/showcases/bin/cli --examples all'
          sshcmd 'rm -f /tmp/score_showcases_autosd_latest.oci'
        working-directory: ./images/autosd
        env:
          SSH_PASSWORD: password
      - name: Archive Modified Image
        run: |
          xz disk.qcow2
          mv disk.qcow2.xz eclipse-autosd-bootc-qemu-${{ matrix.target }}.qcow2.xz
        working-directory: ./images/autosd
      - name: Store Image
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-autosd-bootc-qemu-${{ matrix.target }}.qcow2.xz
          path: images/autosd/eclipse-autosd-bootc-qemu-${{ matrix.target }}.qcow2.xz
      - name: Package platform and showcases
        if: github.event_name == 'release'
        run: |
          bazel build --lockfile_mode=error --config autosd-${{ matrix.target }} //deploy:platform_tar //showcases:showcases_pkg_tar
          gzip -c bazel-bin/deploy/platform_tar.tar > score-platform-autosd-${{ matrix.target }}.tar.gz
          gzip -c bazel-bin/showcases/showcases_pkg_tar.tar > score-showcases-autosd-${{ matrix.target }}.tar.gz
      - name: Store platform and showcases packages
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: score-release-autosd-${{ matrix.target }}
          path: |
            score-platform-autosd-${{ matrix.target }}.tar.gz
            score-showcases-autosd-${{ matrix.target }}.tar.gz
  release:
    name: Publish image to release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_NAME: ${{ github.event.release.tag_name }}
    steps:
      - name: Download archived image artifact
        uses: actions/download-artifact@v4
        with:
          name: eclipse-autosd-bootc-qemu-${{ matrix.target}}.qcow2.xz
          path: ./release-assets
      - name: Download platform and showcases packages
        uses: actions/download-artifact@v4
        with:
          name: score-release-autosd-x86_64
          path: ./release-assets
      - name: Upload image to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_NAME" \
            ./release-assets/eclipse-autosd-bootc-qemu-${{ matrix.target }}.qcow2.xz \
            ./release-assets/score-platform-autosd-${{ matrix.target }}.tar.gz \
            ./release-assets/score-showcases-autosd-${{ matrix.target }}.tar.gz \
            --clobber
