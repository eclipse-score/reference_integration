name: EB corbos Linux for Safety Applications - Build & Integration Test
on:
  release:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  # Called by unified_workflow.yml. The event triggers above stay until the unified pipeline is
  # the required check (rollout stage D); inputs are empty for those standalone runs, and a
  # non-empty resolved_inputs is what marks a called run.
  workflow_call:
    inputs:
      fresh:
        description: Build and test from scratch (no disk cache, no cached test results).
        type: boolean
        required: false
        default: false
      resolved_inputs:
        description: >-
          Name of the resolved-inputs artifact to restore. Set by unified_workflow.yml, which also marks the run as called; empty for standalone runs (committed files).
        type: string
        required: false
        default: ''
# Do not flood CI with unneeded previous runs in PR. Literal prefix and a per-run group when
# called: inside a call github.workflow is the caller's name, and the leaves of one unified run
# must not share a group with each other or with the caller.
concurrency:
  group: build-and-test-ebclfsa-${{ inputs.resolved_inputs != '' && github.run_id || github.event.pull_request.number }}
  cancel-in-progress: ${{ inputs.resolved_inputs == '' && github.ref_name != 'main' && !startsWith(github.ref_name, 'release/') }}
jobs:
  build:
    name: aarch64
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/eclipse-score/devcontainer:v1.11.4
    permissions:
      contents: read
    steps:
      - name: Clean disk space
        uses: eclipse-score/more-disk-space@v1
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore resolved inputs
        if: inputs.resolved_inputs != ''
        uses: ./.github/actions/restore-resolved-inputs
        with:
          artifact: ${{ inputs.resolved_inputs }}
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          # Literal cache name: inside a called workflow github.workflow is the caller's name.
          disk-cache: ${{ inputs.fresh && 'false' || 'EB corbos Linux for Safety Applications - Build & Integration Test' }}
          repository-cache: true
          cache-save: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      - name: Build for EB corbos Linux for Safety Applications and run tests
        run: |
          bazel build --lockfile_mode=error --config=eb-aarch64 //images/ebclfsa_aarch64:run
      - name: Upload test logs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ebclfsa-test-logs
          path: |
            bazel-bin/images/ebclfsa_aarch64/build/*.log
      - name: Package platform and showcases
        if: github.event_name == 'release'
        run: |
          bazel build --lockfile_mode=error --config=eb-aarch64 //deploy:platform_tar //showcases:showcases_pkg_tar
          gzip -c bazel-bin/deploy/platform_tar.tar > score-platform-eb-aarch64.tar.gz
          gzip -c bazel-bin/showcases/showcases_pkg_tar.tar > score-showcases-eb-aarch64.tar.gz
      - name: Store platform and showcases packages
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: score-release-eb-aarch64
          path: |
            score-platform-eb-aarch64.tar.gz
            score-showcases-eb-aarch64.tar.gz
  release:
    name: Publish platform and showcases to release
    needs: build
    # Standalone runs only; the unified pipeline publishes from its release-publish job.
    if: github.event_name == 'release' && inputs.resolved_inputs == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform and showcases packages
        uses: actions/download-artifact@v4
        with:
          name: score-release-eb-aarch64
          path: ./release-assets
      - name: Upload platform and showcases to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" ./release-assets/*.tar.gz --clobber
