# Fast documentation check: builds the docs only to surface warnings and errors
# early, without waiting for the test suite in test_and_docs.yml. Nothing is
# deployed from here - the published docs come from test_and_docs.yml.
name: Documentation check
permissions:
  contents: read
on:
  pull_request:
    types: [opened, reopened, synchronize]
jobs:
  docs-check:
    uses: eclipse-score/cicd-workflows/.github/workflows/docs.yml@d2083d5dac0e309643d9f495e61342dfbaf07ed5 # main, 2026-09-24
