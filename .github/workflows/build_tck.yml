name: Build TCK Binary

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tck/**'
  push:
    branches:
      - main
    paths:
      - 'tck/**'
  release:
    types: [created]

jobs:
  build:
    name: Build score-tck binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: tck-build
          repository-cache: true
          cache-save: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Build product SBOM (golden reference)
        run: |
          bazel build --lockfile_mode=error //:sbom

      - name: Build TCK binary
        run: |
          bazel build --lockfile_mode=error //tck:score-tck
          cp bazel-bin/tck/score-tck score-tck
          chmod +x score-tck

      - name: Test TCK binary
        run: |
          ./score-tck version
          echo ""
          echo "Testing with golden SBOM..."
          cat > /tmp/test-dist.toml << 'EOF'
          [dist]
          name = "test-dist"
          version = "0.9.0"
          arch = "x86_64-linux"

          [dist.paths]
          sbom_file = "reference/sbom.spdx.json"
          EOF
          ./score-tck run --config /tmp/test-dist.toml --report /tmp/tck-test-report || true
          echo ""
          echo "Report summary:"
          head -20 /tmp/tck-test-report/summary.md

      - name: Bundle TCK package
        run: |
          VERSION="${{ github.event.release.tag_name || '0.1.0' }}"
          # Create bundle directory structure
          mkdir -p score-tck/bin
          mkdir -p score-tck/reference
          mkdir -p score-tck/docs
          
          # Copy binary
          cp score-tck score-tck/bin/
          
          # Copy golden SBOM
          cp bazel-bin/sbom.spdx.json score-tck/reference/
          
          # Copy config example
          cp tck/tck.config.example.toml score-tck/
          
          # Create README
          cat > score-tck/README.md << 'READMEEOF'
          # s-core Test Compatibility Kit (TCK)
          
          This package verifies SCORE distribution compatibility with platform requirements.
          
          ## Quick Start
          
          1. Create a distribution config:
             ```bash
             cp tck.config.example.toml my-dist.toml
             # Edit sbom_file path to point to your distribution's SBOM
             ```
          
          2. Run the TCK:
             ```bash
             ./bin/score-tck run --config my-dist.toml --report ./report
             ```
          
          3. Check the verdict in `report/summary.md` or `report/report.json`
          
          ## What's Checked
          
          - **SBOM conformance**: Required components present, license policy, drift from golden
          - More checks coming in future versions
          
          ## Exit Codes
          
          - 0: CONFORMANT or CONFORMANT-WITH-WARNINGS
          - 1: NON-CONFORMANT
          READMEEOF
          
          # Create tarball
          tar -czvf score-tck-${VERSION}-linux-x86_64.tar.gz score-tck/
          echo "Created bundle: score-tck-${VERSION}-linux-x86_64.tar.gz"
          ls -la score-tck-*.tar.gz

      - name: Upload TCK bundle artifact
        uses: actions/upload-artifact@604373da6381bf24206979c74d06a550515601b9 # v4.4.1
        with:
          name: score-tck-bundle-linux-x86_64
          path: score-tck-*.tar.gz
          retention-days: 30

      - name: Attach bundle to release
        uses: softprops/action-gh-release@v2.5.0
        if: github.event_name == 'release'
        with:
          files: score-tck-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
