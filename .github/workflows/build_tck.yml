name: Build TCK Binary

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tck/**'
  push:
    branches:
      - main
    paths:
      - 'tck/**'
  release:
    types: [created]

jobs:
  build:
    name: Build score-tck binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: tck-build
          repository-cache: true
          cache-save: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Build product SBOM (golden reference)
        run: |
          bazel build --lockfile_mode=error //:sbom

      - name: Build TCK binary
        run: |
          bazel build --lockfile_mode=error //tck:score-tck
          cp bazel-bin/tck/score-tck score-tck
          chmod +x score-tck

      - name: Test TCK binary
        run: |
          ./score-tck version
          echo ""
          echo "Testing with golden SBOM..."
          cat > /tmp/test-dist.toml << 'EOF'
          [dist]
          name = "test-dist"
          version = "0.9.0"
          arch = "x86_64-linux"

          [dist.paths]
          sbom_file = "bazel-bin/sbom.spdx.json"
          EOF
          ./score-tck run --config /tmp/test-dist.toml --report /tmp/tck-test-report || true
          echo ""
          echo "Report summary:"
          head -20 /tmp/tck-test-report/summary.md

      - name: Upload binary artifact
        uses: actions/upload-artifact@604373da6381bf24206979c74d06a550515601b9 # v4.4.1
        with:
          name: score-tck-linux-x86_64
          path: score-tck
          retention-days: 30

      - name: Attach binary to release
        uses: softprops/action-gh-release@v2.5.0
        if: github.event_name == 'release'
        with:
          files: score-tck
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
