name: Code Quality & Documentation
permissions:
  contents: write
  pages: write
  pull-requests: write
  id-token: write
on:
  pull_request_target: # Allow forks to access secrets
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  release:
    types: [created]
# Do not flood CI with unneeded previous runs in PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.ref_name != 'main' && !startsWith(github.ref_name, 'release/') }}
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  test_and_docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to upload release assets
      pull-requests: write
    steps:
      - name: Clean disk space
        uses: eclipse-score/more-disk-space@v1.1
        with:
          level: 4
      - name: Checkout repository (pull_request_target via workflow_call)
        if: ${{ github.event_name == 'pull_request_target' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref || github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      - name: Checkout repository
        if: ${{ github.event_name != 'pull_request_target' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Docker Buildx
        # Required by the platform integration tests below, which run the
        # showcases against a Docker target built from //images/linux_x86_64:image.
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          # This list feeds the cache key hash of BOTH the repository cache and
          # the disk cache (see config.js: diskCache.files spreads
          # repositoryCacheFiles). The default is MODULE.bazel + WORKSPACE* only,
          # which never changes when we bump a module - so the key never rotates,
          # and setup-bazel skips the save on an exact key hit. Result: both
          # caches freeze on their first entry and go stale without ever failing.
          # Keep this list in sync with anything that invalidates Bazel action
          # keys or the set of fetched module sources.
          repository-cache: |
            - MODULE.bazel
            - known_good.json
            - bazel_common/*.MODULE.bazel
            - patches/**
            - .bazelrc
          cache-save: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
      - name: Install Graphviz
        uses: eclipse-score/apt-install@main
        with:
          packages: graphviz
          cache: false
      - name: Execute Unit Tests with Coverage Analysis
        # Only tag runs are authoritative and re-execute every test from scratch, because they
        # attach the test-report ZIP and the SBOM as official release assets. The condition is
        # deliberately the same one those upload steps use, so the two can never drift apart.
        # Every other event (including push to main) trusts the cache: --nocache_test_results
        # suppresses not only reading but also WRITING test results into the disk-cache, so a
        # push run without --trust-cache would save a cache that contains zero test results,
        # leaving every later PR run with nothing to hit.
        run: |
          python ./scripts/quality_runners.py \
            ${{ github.ref_type != 'tag' && '--trust-cache' || '' }}
      - name: Execute Feature Integration Tests
        run: |
          bazel test --config=linux-x86_64 //feature_integration_tests/test_cases:fit
      - name: Execute Platform Integration Tests
        # Runs in this job - and before the documentation build below - on purpose:
        # the source code linker of the documentation build scans `bazel-testlogs`
        # of this very workspace. Only tests executed here contribute their
        # PartiallyVerifies/FullyVerifies properties as `testlink` attributes to
        # the stakeholder requirement needs, and therefore to the test coverage
        # figures of the platform verification report.
        run: |
          bazel test --lockfile_mode=error --config=linux-x86_64 //platform_integration_tests:pit
      - name: Execute Lifecycle Integration Tests
        # Runs in this job and before the documentation build on purpose: the
        # docs source code linker scans `bazel-testlogs` of this very workspace,
        # so only tests executed here contribute their PartiallyVerifies/
        # FullyVerifies properties as `testlink` attributes to the lifecycle
        # feature AND component requirement needs of the verification reports.
        # The tests live in the lifecycle module; their test-framework
        # dependencies (score_itf, the rules_oci extension) are exposed to this
        # non-root consumer by
        # //patches/lifecycle:002-undev-integration-test-deps.patch. The docker
        # integration mode is selected explicitly via the lifecycle config flag;
        # the qemu-only test variants are target_compatible_with incompatible in
        # docker mode and are skipped automatically.
        #
        # --flaky_test_attempts=3: the ITF docker plugin's execute_async reads the
        # launched PID from the first stdout line (echo $$); occasionally the test
        # binary's own output races ahead of that echo, making the PID parse fail
        # (ValueError in score_itf docker.py). Retrying absorbs that race.
        run: |
          bazel test --lockfile_mode=error --config=linux-x86_64 \
            --flaky_test_attempts=3 \
            --@score_lifecycle//config:integration_mode=docker \
            @score_lifecycle//tests/integration/...
      - name: Execute Logging Component Tests
        # Same rationale as the lifecycle step above: these tests run in this job
        # and before the documentation build so the docs source code linker picks
        # up their PartiallyVerifies properties from `bazel-testlogs`, turning
        # them into `testlink` attributes on the logging component requirement
        # needs of the verification reports. The tests live in the logging module
        # under //score/test/component; their test-framework dependencies
        # (score_itf, the rules_oci extension, score_rules_imagefs) are exposed to
        # this non-root consumer by
        # //patches/logging:002-undev-component-test-deps.patch. The docker image
        # variant is the x86_64/linux platform default; the qnx_ifs/qemu variants
        # are target_compatible_with incompatible here and are skipped
        # automatically. --flaky_test_attempts=3 absorbs the same ITF docker PID
        # read race as the lifecycle step above.
        run: |
          bazel test --lockfile_mode=error --config=linux-x86_64 \
            --flaky_test_attempts=3 \
            @score_logging//score/test/component/...
      - name: Execute Persistency Component Integration Tests
        # Same rationale as the module steps above. The persistency "cit"
        # (component integration test) suite is a pair of score_py_pytest host
        # targets (cit_cpp + cit_rust) that drive the KVS C++/Rust test scenarios
        # directly - no Docker involved - and carry comp_req__kvs__* annotations
        # via the attribute_plugin. They need no dev-dependency patch (persistency
        # already un-devs pip/imagefs/googletest upstream) but are excluded from
        # the standard persistency test run, so they are executed explicitly here
        # to contribute their testlinks to the module verification report.
        run: |
          bazel test --lockfile_mode=error --config=linux-x86_64 \
            @score_persistency//score/kvs/tests/test_cases:cit
      - name: Install uv (required for SBOM license scanning)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Build build tools SBOM
        run: |
          bazel build --lockfile_mode=error //:build_tools_sbom
      - name: Create archive of test reports
        if: github.ref_type == 'tag'
        run: |
          mkdir -p artifacts
          find bazel-testlogs/external -name 'test.xml' -print0 | xargs -0 -I{} cp --parents {} artifacts/
          cp -r "$(bazel info --lockfile_mode=error bazel-bin)/coverage/rust-tests" artifacts/rust
          zip -r ${{ github.event.repository.name }}_test_reports.zip artifacts/
        shell: bash
      - name: Upload release asset (attach ZIP to GitHub Release)
        uses: softprops/action-gh-release@v2.5.0
        if: github.ref_type == 'tag'
        with:
          files: ${{ github.event.repository.name }}_test_reports.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload build tools SBOM (workflow artifact)
        uses: actions/upload-artifact@604373da6381bf24206979c74d06a550515601b9 # v4.4.1
        with:
          name: build-tools-sbom-${{ github.event.pull_request.head.sha || github.sha }}
          path: bazel-bin/build_tools_sbom.spdx.json
          retention-days: 3
          if-no-files-found: error
      - name: Upload build tools SBOM (attach to GitHub Release)
        uses: softprops/action-gh-release@v2.5.0
        if: github.ref_type == 'tag'
        with:
          files: bazel-bin/build_tools_sbom.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build documentation
        run: |
          bazel run \
            --lockfile_mode=error \
              //:docs_shim -- \
              --github_user=${{ github.repository_owner }} \
              --github_repo=${{ github.event.repository.name }}

          CURRENT=$(realpath .)
          bazel run //scripts/tooling -- misc html_report --output ${CURRENT}/_build/status_dashboard.html
          tar -cf github-pages.tar _build
      - name: Upload documentation artifact
        uses: actions/upload-artifact@604373da6381bf24206979c74d06a550515601b9 # v4.4.1
        with:
          name: github-pages-${{ github.event.pull_request.head.sha || github.sha }}
          path: github-pages.tar
          retention-days: 3
          if-no-files-found: error
  docs-deploy:
    name: Deploy Documentation to GitHub Pages
    runs-on: ${{ vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-latest' }}
    needs: test_and_docs
    permissions:
      pages: write
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Ensure gh-pages branch exists with initial files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          if ! git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" gh-pages; then
            echo "gh-pages branch does not exist. Creating it..."
            git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" repo
            cd repo
            git fetch origin main --depth=1
            AUTHOR_NAME=$(git log origin/main -1 --pretty=format:'%an')
            AUTHOR_EMAIL=$(git log origin/main -1 --pretty=format:'%ae')
            git config user.name "$AUTHOR_NAME"
            git config user.email "$AUTHOR_EMAIL"
            echo "Using commit identity: $AUTHOR_NAME <$AUTHOR_EMAIL>"

            git checkout --orphan gh-pages
            git rm -rf . || true
            REPO_NAME=$(basename "${REPO}")
            OWNER_NAME="${REPO%%/*}"

            touch versions.json
            echo "[" > versions.json
            echo "  {" >> versions.json
            echo "    \"version\": \"main\"," >> versions.json
            echo "    \"url\": \"https://${OWNER_NAME}.github.io/${REPO_NAME}/main/\"" >> versions.json
            echo "  }" >> versions.json
            echo "]" >> versions.json

            touch index.html
            echo '<!DOCTYPE html>' > index.html
            echo '<html lang="en">' >> index.html
            echo '<head>' >> index.html
            echo '    <meta charset="UTF-8">' >> index.html
            echo '    <meta http-equiv="refresh" content="0; URL=main/">' >> index.html
            echo '    <title>Redirecting...</title>' >> index.html
            echo '</head>' >> index.html
            echo '<body>' >> index.html
            echo '    <p>If you are not redirected, <a href="main/">click here</a>.</p>' >> index.html
            echo '</body>' >> index.html
            echo '</html>' >> index.html

            touch .nojekyll
            git add versions.json index.html .nojekyll
            git commit -m "Initialize gh-pages branch with versions.json and index.html"
            git push origin gh-pages
            cd ..
            rm -rf repo
          else
            echo "gh-pages branch exists. Skipping creation."
          fi
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download documentation artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: github-pages-${{ github.event.pull_request.head.sha || github.sha }}
      - name: Untar documentation artifact
        run: mkdir -p extracted_docs && tar -xf github-pages.tar -C extracted_docs
      - name: Deploy 🚀
        id: pages-deployment
        uses: eclipse-score/cicd-workflows/.github/actions/deploy-versioned-pages@main
        with:
          source_folder: extracted_docs/_build
          deployment_type: workflow
