# TEMPORARY - delete before merging PR #478.
# Runs only //platform_integration_tests/drive_replay on pushes to the PR branch: the PR's
# regular CI runs via pull_request_target with the workflow files of main, and all tests.
name: Drive Replay Preview (temporary)
permissions:
  contents: read
on:
  push:
    branches:
      - feat/drive-replay-demo
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  drive_replay:
    runs-on: ubuntu-24.04
    steps:
      - name: Clean disk space
        uses: eclipse-score/more-disk-space@v1.1
        with:
          level: 4
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          # Reuse (read only) the disk cache of "Code Quality & Documentation" on main.
          disk-cache: Code Quality & Documentation
          repository-cache: |
            - MODULE.bazel
            - known_good.json
            - bazel_common/*.MODULE.bazel
            - patches/**
            - .bazelrc
          cache-save: false
      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Execute drive replay platform integration test
        run: |
          bazel test --lockfile_mode=error --config=linux-x86_64 --test_output=errors //platform_integration_tests/drive_replay
      - name: Upload DLT trace and test log
        if: always()
        uses: actions/upload-artifact@604373da6381bf24206979c74d06a550515601b9 # v4.4.1
        with:
          name: drive-replay-dlt-${{ github.sha }}
          path: |
            bazel-testlogs/platform_integration_tests/drive_replay/drive_replay/test.outputs/drive_replay.dlt
            bazel-testlogs/platform_integration_tests/drive_replay/drive_replay/test.log
          retention-days: 7
          if-no-files-found: warn
