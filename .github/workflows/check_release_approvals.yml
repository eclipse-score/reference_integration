name: Check Release Branch Approvals
on:
  pull_request_review:
    types: [submitted, edited, dismissed]
jobs:
  check-approvals:
    name: Verify Required Approvals
    if: startsWith(github.event.pull_request.base.ref, 'releases/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Bazel
        uses: eclipse-score/cicd-actions/setup-bazel-cache@28233566af2525acf84b3c66cfa66ae2583e4236
        with:
          disk-cache-key: ${{ github.workflow }}-${{ github.job }}
          cache-save-branch-patterns: |
            main
            release/**
            releases/**
          # pull_request_target uses the base branch ref even when testing PR code.
          # Only trusted branch runs may publish cache generations.
          bazelisk-cache-save: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          disk-cache-save: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          repository-cache-save: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'auto' || 'false' }}
          external-cache-save: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          # Preserve even small additions, such as a newly downloaded toolchain.
          repository-cache-growth-threshold: 0
      - name: Check Release Approvals
        id: check-approvals
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.base_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bazel run //scripts/tooling -- release check_approvals
      - name: Success
        if: steps.check-approvals.outputs.all-approved == 'true'
        run: |
          echo "✅ All modules have required approvals"
          echo "Approved modules: ${{ steps.check-approvals.outputs.approved-modules }}"
