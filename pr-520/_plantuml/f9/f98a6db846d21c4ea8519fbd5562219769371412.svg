<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1368px;height:1081px;background:#FFFFFF;" width="1368px" height="1081px" viewBox="0 0 1368 1081" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="597.988" y="22.995" fill="#000" font-size="14" textLength="165.895" font-weight="700">Graph State Machine</text></g><g class="entity" data-qualified-name="kSuccess" id="ent0001" data-source-line="4"><rect x="870.5" y="140.297" width="263.339" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="870.5" y1="166.594" x2="1133.839" y2="166.594" style="stroke:#181818;stroke-width:0.5;"/><text x="969.938" y="158.292" fill="#000" font-size="14" textLength="64.463">kSuccess</text><text x="875.5" y="184.589" fill="#000" font-size="14" textLength="243.339">the requested Run Target is active</text></g><g class="entity" data-qualified-name="kInTransition" id="ent0002" data-source-line="5"><rect x="588.5" y="360.297" width="267.297" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="588.5" y1="386.594" x2="855.797" y2="386.594" style="stroke:#181818;stroke-width:0.5;"/><text x="676.713" y="378.292" fill="#000" font-size="14" textLength="90.87">kInTransition</text><text x="593.5" y="404.589" fill="#000" font-size="14" textLength="247.297">Run Target transition is in progress</text></g><g class="entity" data-qualified-name="kAborting" id="ent0003" data-source-line="6"><rect x="7" y="546.797" width="268.097" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="573.094" x2="275.097" y2="573.094" style="stroke:#181818;stroke-width:0.5;"/><text x="107.033" y="564.792" fill="#000" font-size="14" textLength="68.031">kAborting</text><text x="12" y="591.089" fill="#000" font-size="14" textLength="248.097">Wait for ongoing jobs to finish after</text><text x="12" y="607.386" fill="#000" font-size="14" textLength="236.564">a failure or transition cancellation</text></g><g class="entity" data-qualified-name="kUndefinedState" id="ent0004" data-source-line="7"><rect x="667" y="719.297" width="256.482" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="667" y1="745.594" x2="923.482" y2="745.594" style="stroke:#181818;stroke-width:0.5;"/><text x="736.753" y="737.292" fill="#000" font-size="14" textLength="116.977">kUndefinedState</text><text x="672" y="763.589" fill="#000" font-size="14" textLength="195.843">No ongoing jobs, graph is in</text><text x="672" y="779.886" fill="#000" font-size="14" textLength="236.482">an undefined but consistent state</text></g><g class="start_entity" data-qualified-name=".start." id="ent0005" data-source-line="9"><ellipse cx="1002" cy="53.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><!--link *start* to kSuccess--><g class="link" data-entity-1="ent0005" data-entity-2="ent0001" id="lnk6" data-source-line="9" data-link-type="dependency"><path d="M1002,63.417 C1002,79.957 1002,110.447 1002,134.967" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-kSuccess"/><polygon points="1002,139.967,1006,130.967,1002,134.967,998,130.967,1002,139.967" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1003" y="106.364" fill="#000" font-size="13" textLength="80.844">construction</text></g><!--link kSuccess to kInTransition--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-source-line="12" data-link-type="dependency"><path d="M870.37,177.637 C806.28,185.447 738.8,199.227 719,223.297 C687.17,261.967 699.372,320.383 710.802,355.483" style="stroke:#181818;stroke-width:1;" fill="none" id="kSuccess-to-kInTransition"/><polygon points="712.35,360.237,713.367,350.441,710.802,355.483,705.76,352.918,712.35,360.237" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="777.408" y="236.364" fill="#000" font-size="13" textLength="123.437">main loop iteration</text><text x="720" y="251.497" fill="#000" font-size="13" textLength="238.253">[a pending Run Target has been set,</text><text x="776.865" y="266.629" fill="#000" font-size="13" textLength="124.522">differs from active]</text><text x="837.06" y="281.762" fill="#000" font-size="13"> </text><text x="771.013" y="296.895" fill="#000" font-size="13" textLength="136.227">start initial transition</text><text x="837.06" y="312.028" fill="#000" font-size="13"> </text><text x="770.604" y="327.161" fill="#000" font-size="13" textLength="137.046">start transition to Off</text></g><!--link kInTransition to kSuccess--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk10" data-source-line="17" data-link-type="dependency"><path d="M855.63,367.647 C902.11,358.757 946.72,346.427 963,330.297 C999.79,293.847 1004.324,234.226 1003.654,198.436" style="stroke:#181818;stroke-width:1;" fill="none" id="kInTransition-to-kSuccess"/><polygon points="1003.56,193.437,999.729,202.51,1003.654,198.436,1007.728,202.36,1003.56,193.437" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1019.234" y="273.864" fill="#000" font-size="13" textLength="106.463">Last job finished</text><text x="1004" y="288.997" fill="#000" font-size="13" textLength="136.932">[transition complete]</text></g><!--link kUndefinedState to kInTransition--><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" id="lnk8" data-source-line="13" data-link-type="dependency"><path d="M822.34,719.227 C840.05,695.227 861.51,661.277 871,627.297 C882,587.917 886.74,573.037 871,535.297 C849.07,482.727 802.34,442.211 766.16,416.401" style="stroke:#181818;stroke-width:1;" fill="none" id="kUndefinedState-to-kInTransition"/><polygon points="762.09,413.497,767.094,421.98,766.16,416.401,771.74,415.467,762.09,413.497" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="940.878" y="548.364" fill="#000" font-size="13" textLength="123.437">main loop iteration</text><text x="883" y="563.497" fill="#000" font-size="13" textLength="239.192">[a pending Run Target has been set]</text><text x="1000.53" y="578.629" fill="#000" font-size="13"> </text><text x="940.878" y="593.762" fill="#000" font-size="13" textLength="123.437">main loop iteration</text><text x="922.752" y="608.895" fill="#000" font-size="13" textLength="159.688">[no pending Run Target]</text><text x="938.875" y="624.028" fill="#000" font-size="13" textLength="127.442">self-heal to fallback</text></g><!--link kInTransition to kUndefinedState--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk12" data-source-line="21" data-link-type="dependency"><path d="M703.97,413.477 C674.92,458.277 624.15,553.027 657,627.297 C673.96,665.647 705.018,694.402 735.578,716.332" style="stroke:#181818;stroke-width:1;" fill="none" id="kInTransition-to-kUndefinedState"/><polygon points="739.64,719.247,734.66,710.75,735.578,716.332,729.996,717.249,739.64,719.247" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="658" y="578.364" fill="#000" font-size="13" textLength="204.826">same as transition to kAborting</text><text x="681.09" y="593.497" fill="#000" font-size="13" textLength="158.647">but with no jobs running</text></g><!--link kInTransition to kInTransition--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" id="lnk9" data-source-line="16" data-link-type="dependency"><path d="M855.83,372.057 C876.46,374.287 890.5,379.197 890.5,386.797 C890.5,394.397 881.431,398.77 860.801,401" style="stroke:#181818;stroke-width:1;" fill="none" id="kInTransition-to-kInTransition"/><polygon points="855.83,401.537,865.208,404.546,860.801,401,864.348,396.593,855.83,401.537" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="938.972" y="383.864" fill="#000" font-size="13" textLength="75.251">job finished</text><text x="896.5" y="398.997" fill="#000" font-size="13" textLength="160.196">[transition has work left]</text></g><!--link kInTransition to kAborting--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk11" data-source-line="20" data-link-type="dependency"><path d="M588.33,391.537 C467.46,397.007 299.98,410.437 243,443.297 C202.03,466.927 174.784,509.829 158.354,542.189" style="stroke:#181818;stroke-width:1;" fill="none" id="kInTransition-to-kAborting"/><polygon points="156.09,546.647,163.731,540.433,158.354,542.189,156.598,536.811,156.09,546.647" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="300.377" y="463.864" fill="#000" font-size="13" textLength="273.8">activation failed, unexpected termination,</text><text x="244" y="478.997" fill="#000" font-size="13" textLength="386.553">new Run Target requested, supervision failure or shutdown</text><text x="378.342" y="494.129" fill="#000" font-size="13" textLength="117.87">[jobs still running]</text></g><!--link kAborting to kAborting--><g class="link" data-entity-1="ent0003" data-entity-2="ent0003" id="lnk13" data-source-line="24" data-link-type="dependency"><path d="M275.23,573.417 C295.92,574.607 310,577.227 310,581.297 C310,585.367 300.912,587.7 280.222,588.89" style="stroke:#181818;stroke-width:1;" fill="none" id="kAborting-to-kAborting"/><polygon points="275.23,589.177,284.445,592.653,280.222,588.89,283.985,584.667,275.23,589.177" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="332.59" y="578.364" fill="#000" font-size="13" textLength="75.251">job finished</text><text x="316" y="593.497" fill="#000" font-size="13" textLength="108.431">[not the last job]</text></g><!--link kAborting to kAborting--><g class="link" data-entity-1="ent0003" data-entity-2="ent0003" id="lnk15" data-source-line="26" data-link-type="dependency"><path d="M275.32,564.627 C352.6,562.127 430,567.687 430,581.297 C430,594.907 357.597,600.629 280.317,598.129" style="stroke:#181818;stroke-width:1;" fill="none" id="kAborting-to-kAborting-1"/><polygon points="275.32,597.967,284.186,602.256,280.317,598.129,284.445,594.26,275.32,597.967" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="436" y="585.864" fill="#000" font-size="13" textLength="144.377">cancel or new request</text></g><!--link kAborting to kUndefinedState--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk14" data-source-line="25" data-link-type="dependency"><path d="M269.82,615.877 C384.71,645.837 547.182,688.185 661.902,718.095" style="stroke:#181818;stroke-width:1;" fill="none" id="kAborting-to-kUndefinedState"/><polygon points="666.74,719.357,659.04,713.216,661.902,718.095,657.022,720.957,666.74,719.357" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="547" y="670.364" fill="#000" font-size="13" textLength="75.251">job finished</text><text x="555.855" y="685.497" fill="#000" font-size="13" textLength="57.542">[last job]</text></g><!--link kSuccess to kUndefinedState--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk16" data-source-line="29" data-link-type="dependency"><path d="M1115.07,193.487 C1128.39,201.007 1140.31,210.727 1149,223.297 C1194.92,289.717 1231.82,491.007 1131,627.297 C1082.67,692.627 1001.197,722.949 928.127,737.979" style="stroke:#181818;stroke-width:1;" fill="none" id="kSuccess-to-kUndefinedState"/><polygon points="923.23,738.987,932.851,741.092,928.127,737.979,931.24,733.256,923.23,738.987" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1196" y="456.364" fill="#000" font-size="13" textLength="156.87">unexpected termination</text><text x="1272.369" y="471.497" fill="#000" font-size="13"> </text><text x="1223.768" y="486.629" fill="#000" font-size="13" textLength="101.334">late completion</text><text x="1204.738" y="501.762" fill="#000" font-size="13" textLength="139.395">[last outstanding job]</text></g><!--link kUndefinedState to kUndefinedState--><g class="link" data-entity-1="ent0004" data-entity-2="ent0004" id="lnk17" data-source-line="30" data-link-type="dependency"><path d="M923.13,739.947 C943.81,741.957 958,746.567 958,753.797 C958,761.027 948.787,765.153 928.107,767.163" style="stroke:#181818;stroke-width:1;" fill="none" id="kUndefinedState-to-kUndefinedState"/><polygon points="923.13,767.647,932.475,770.757,928.107,767.163,931.701,762.795,923.13,767.647" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="964" y="758.364" fill="#000" font-size="13" textLength="156.87">unexpected termination</text></g><g class="legend" data-source-line="32"><rect x="348.992" y="808.188" width="663.885" height="254.453" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="353.992" y="826.183" fill="#000" font-size="14" textLength="415.461">A Run Target request will record the "pending Run Target".</text><text x="353.992" y="842.479" fill="#000" font-size="14" textLength="583.023">The cyclic main loop will check in each iteration for a recorded pending Run Target</text><text x="353.992" y="858.776" fill="#000" font-size="14" textLength="580.569">and initiates the Run Target transition when in kSuccess or kUndefinedState state.</text><text x="353.992" y="875.073" fill="#000" font-size="14"> </text><text x="353.992" y="891.37" fill="#000" font-size="14" textLength="550.737">kUndefinedState is not terminal. Every main loop iteration leaves it, towards a</text><text x="353.992" y="907.667" fill="#000" font-size="14" textLength="575.176">recorded pending Run Target request if there is one and towards the fallback Run</text><text x="353.992" y="923.964" fill="#000" font-size="14" textLength="123.32">Target otherwise.</text><text x="353.992" y="940.261" fill="#000" font-size="14"> </text><text x="353.992" y="956.558" fill="#000" font-size="14" textLength="566.289">Before a new transition can be started any currently ongoing jobs need to finish.</text><text x="353.992" y="972.854" fill="#000" font-size="14" textLength="571.006">kAborting is the state that is waiting for jobs to finish. No new jobs will be started</text><text x="353.992" y="989.151" fill="#000" font-size="14" textLength="568.914">in this state. When the in-flight job count reaches zero (no more jobs in process),</text><text x="353.992" y="1005.448" fill="#000" font-size="14" textLength="263.635">the graph moves to kUndefinedState.</text><text x="353.992" y="1021.745" fill="#000" font-size="14"> </text><text x="353.992" y="1038.042" fill="#000" font-size="14" textLength="653.885">Requests made while in kAborting do not change the state immediately, but only change the</text><text x="353.992" y="1054.339" fill="#000" font-size="14" textLength="445.136">target for the transition that will be started in kUndefinedState.</text></g><?plantuml-src jLR9Rjim4BthAmQzT86T3-YXG0eKHO4kG9gYXzW7cXfPh2dI9QcexjTtPYZPigm6NOqSOfEplFTcOJB98hmEQb_3nwGImZkbQ-EmA7OVMwqnHdWEgKO8-BN5cB24czR1hGfRJ60YA9tCFHQxD-usA1TDCjwHoUXIElrEzus3VV3RG9wBtVN6XsJSbWm-AvEWyW6ysth-wOlVH4WUAkDCh45L2SFAAQYKiMr0eAiZprevZTOg_bBiFhaIoGxBZEavlFTdVXUm5SYI3pbrq0uMi6aJQ4z-2QnB4Db3KTmzMyDo-G96hF2b55ej8Ol7TBpasncG6YUt_FtFYNw9Ec6tKKIZzNuFXbWHq2jtfs2FhkJe8_Ph5M63w21YMgpekAemHAY2RthjrYiobiI938gWx2Ztqza83wdoeQekQFw7cKfEyxREpnZJ_OYsMjR8sLFHA6itIky6NKBhtB-GPJafz3d8L61zqM99-Ou2CiBEXnrOhD9wpjMfkjwgc1vmfNspjvXmFI2qgEx_6y9HdqhDY1RIYLWkg7VmsnurpmRIgJ5EZgdO77PZWOyZP06ntMEuDt5mqpTqhDjK-evbblQFoLWxY3TBs4MdHzKW4C_dvNf4i7BStv