<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="909px" preserveAspectRatio="none" style="width:989px;height:909px;background:#FFFFFF;" version="1.1" viewBox="0 0 989 909" width="989px" zoomAndPan="magnify"><title>log message filtering based on log_level (Datarouter - Backend)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="505.374" x="240.4529" y="32.9951">log message filtering based on log_level (Datarouter - Backend)</text><path d="M10,47.2969 L10,72.4297 A0,0 0 0 0 10,72.4297 L659.4751,72.4297 A0,0 0 0 0 659.4751,72.4297 L659.4751,65.2969 L679.4751,59.8633 L659.4751,57.2969 L659.4751,57.2969 L649.4751,47.2969 L10,47.2969 A0,0 0 0 0 10,47.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M649.4751,47.2969 L649.4751,57.2969 L659.4751,57.2969 L649.4751,47.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="628.4751" x="16" y="64.3638">This Flow diagram excludes the sequence for filtering DLT logs based on diagnostic job requests</text><ellipse cx="689.4751" cy="59.8633" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="488" x="445.4751" y="92.4297"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="468" x="455.4751" y="113.5684">log_level_threshold = kVerbose (Default, hardcoded in socketserver_config.h)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="248.8906" x="565.0298" y="146.3984"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="228.8906" x="575.0298" y="167.5371">log_level = kInfo (Default, hardcoded)</text><path d="M21.7917,190.3672 L21.7917,245.7656 L539.4514,245.7656 L539.4514,200.3672 L529.4514,190.3672 L21.7917,190.3672 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M529.4514,190.3672 L529.4514,200.3672 L539.4514,200.3672 L529.4514,190.3672 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="431.8755" x="27.7917" y="207.4341">The class-id.json file is an output of the dlt_create_fibex generator</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="496.6597" x="27.7917" y="222.5669">containing unique message ids mapped to app_id, ctx_id and log_level pairs</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.0713" x="27.7917" y="237.6997">for message Types that needs to be traced out</text><path d="M305.1343,298.5859 L305.1343,323.7188 A0,0 0 0 0 305.1343,323.7188 L405.6704,323.7188 A0,0 0 0 0 405.6704,323.7188 L405.6704,316.5859 L425.6704,311.1523 L405.6704,308.5859 L405.6704,308.5859 L395.6704,298.5859 L305.1343,298.5859 A0,0 0 0 0 305.1343,298.5859 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M395.6704,298.5859 L395.6704,308.5859 L405.6704,308.5859 L395.6704,298.5859 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.5361" x="311.1343" y="315.6528">class-id.json</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="527.6094" x="425.6704" y="294.168"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="507.6094" x="435.6704" y="315.3066">Register message based on NvMsgDescriptor (message_id, app_id, ctx_id, log_level)</text><path d="M52.0928,354.9219 L52.0928,410.3203 A0,0 0 0 