oke-width:0.5;" width="485.498" x="446.7261" y="632.4019"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="465.498" x="456.7261" y="653.5405">log_level_threshold = message_threshold (log_level) for the respective ctx_id</text><polygon fill="#F1F1F1" points="564.5461,583.9995,814.4041,583.9995,826.4041,595.9995,814.4041,607.9995,564.5461,607.9995,552.5461,595.9995,564.5461,583.9995" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="693.4751" y="618.21">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="249.8579" x="564.5461" y="599.8076">message thresholds set in log-channels.json?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="826.4041" y="593.4053">no</text><polygon fill="#F1F1F1" points="689.4751,686.3706,701.4751,698.3706,689.4751,710.3706,677.4751,698.3706,689.4751,686.3706" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="605.3853,730.3706,773.5649,730.3706,785.5649,742.3706,773.5649,754.3706,605.3853,754.3706,593.3853,742.3706,605.3853,730.3706" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="168.1797" x="605.3853" y="746.1787">log_level &gt; logLevel_threshold</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="574.377" y="739.7764">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="785.5649" y="739.7764">no</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="216.9102" x="443.5938" y="764.3706"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.49