<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1003px;height:923px;background:#FFFFFF;" width="1003px" height="923px" viewBox="0 0 1003 923" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="247.953" y="32.995" fill="#000" font-size="14" textLength="505.374" font-weight="700">log message filtering based on log_level (Datarouter - Backend)</text></g><path d="M15,52.297 L15,77.43 A0,0 0 0 0 15,77.43 L664.475,77.43 A0,0 0 0 0 664.475,77.43 L664.475,70.297 L684.475,64.863 L664.475,62.297 L664.475,62.297 L654.475,52.297 L15,52.297 A0,0 0 0 0 15,52.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M654.475,52.297 L654.475,62.297 L664.475,62.297 L654.475,52.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="21" y="69.364" fill="#000" font-size="13" textLength="628.475">This Flow diagram excludes the sequence for filtering DLT logs based on diagnostic job requests</text><ellipse cx="694.475" cy="64.863" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="450.475" y="97.43" width="488" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="460.475" y="118.568" fill="#000" font-size="12" textLength="468">log_level_threshold = kVerbose (Default, hardcoded in socketserver_config.h)</text><rect x="570.03" y="151.398" width="248.891" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="580.03" y="172.537" fill="#000" font-size="12" textLength="228.891">log_level = kInfo (Default, hardcoded)</text><path d="M26.792,195.367 L26.792,250.766 L544.451,250.766 L544.451,205.367 L534.451,195.367 L26.792,195.367" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M534.451,195.367 L534.451,205.367 L544.451,205.367 L534.451,195.367" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="32.792" y="212.434" fill="#000" font-size="13" textLength="431.875">The class-id.json file is an output of the dlt_create_fibex generator</text><text x="32.792" y="227.567" fill="#000" font-size="13" textLength="496.66">containing unique message ids mapped to app_id, ctx_id and log_level pairs</text><text x="32.792" y="242.7" fill="#000" font-size="13" textLength="306.071">for message Types that needs to be traced out</text><path d="M310.134,303.586 L310.134,328.719 A0,0 0 0 0 310.134,328.719 L410.67,328.719 A0,0 0 0 0 410.67,328.719 L410.67,321.586 L430.67,316.152 L410.67,313.586 L410.67,313.586 L400.67,303.586 L310.134,303.586 A0,0 0 0 0 310.134,303.586" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M400.67,303.586 L400.67,313.586 L410.67,313.586 L400.67,303.586" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="316.134" y="320.653" fill="#000" font-size="13" textLength="79.536">class-id.json</text><rect x="430.67" y="299.168" width="527.609" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="440.67" y="320.307" fill="#000" font-size="12" textLength="507.609">Register message based on NvMsgDescriptor (message_id, app_id, ctx_id, log_level)</text><path d="M57.093,359.922 L57.093,415.32 A0,0 0 0 0 57.093,415.32 L537.86,415.32 A0,0 0 0 0 537.86,415.32 L537.86,391.621 L557.86,387.621 L537.86,383.621 L537.86,369.922 L527.86,359.922 L57.093,359.922 A0,0 0 0 0 57.093,359.922" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M527.86,359.922 L527.86,369.922 L537.86,369.922 L527.86,359.922" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="63.093" y="376.989" fill="#000" font-size="13" textLength="459.767">The log_level is picked based on the inputs for the dlt_fibex_defenition</text><text x="63.093" y="392.122" fill="#000" font-size="13" textLength="381.291">generator for the respective Type that needs to be traced.</text><text x="63.093" y="407.254" fill="#000" font-size="13" textLength="106.158">E.g.: *_fibex.cpp</text><rect x="557.86" y="370.637" width="273.23" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="567.86" y="391.775" fill="#000" font-size="12" textLength="253.23">log_level = log_level for app_id ctx_id pair</text><polygon points="556.451,250.766,832.499,250.766,844.499,262.766,832.499,274.766,556.451,274.766,544.451,262.766,556.451,250.766" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="698.475" y="284.976" fill="#000" font-size="11" textLength="19.008">yes</text><text x="556.451" y="266.574" fill="#000" font-size="11" textLength="276.047">Parse class-id.json file (message ID table) success</text><text x="844.499" y="260.171" fill="#000" font-size="11" textLength="13.702">no</text><polygon points="694.475,435.32,706.475,447.32,694.475,459.32,682.475,447.32,694.475,435.32" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="615.928,479.32,773.022,479.32,785.022,491.32,773.022,503.32,615.928,503.32,603.928,491.32,615.928,479.32" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="698.475" y="513.531" fill="#000" font-size="11" textLength="19.008">yes</text><text x="615.928" y="495.128" fill="#000" font-size="11" textLength="157.094">log-channels.json file found?</text><text x="785.022" y="488.726" fill="#000" font-size="11" textLength="13.702">no</text><ellipse cx="820.724" cy="491.32" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="820.724" cy="491.32" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><path d="M457.295,539.449 L457.295,564.582 A0,0 0 0 0 457.295,564.582 L591.728,564.582 A0,0 0 0 0 591.728,564.5